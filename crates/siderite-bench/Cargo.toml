[package]
name = "siderite-bench"
description = "Criterion benchmarks for siderite routing, extraction and the ORM"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[lib]
bench = false

[dependencies]

[dev-dependencies]
axum.workspace = true
siderite-web.workspace = true
siderite-backends = { workspace = true, features = ["sqlite", "postgres"] }
criterion = { workspace = true, features = ["async_tokio"] }
# 0.32 shares libsqlite3-sys 0.30 with sqlx; "bundled" matches what sqlx's
# `sqlite` feature already turns on, so there is one SQLite build.
rusqlite = { version = "0.32", features = ["bundled"] }
http.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
tokio.workspace = true
tower.workspace = true

[[bench]]
name = "routing"
harness = false

[[bench]]
name = "extract"
harness = false

[[bench]]
name = "orm"
harness = false

[[bench]]
name = "cache"
harness = false
