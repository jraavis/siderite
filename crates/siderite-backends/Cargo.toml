[package]
name = "siderite-backends"
description = "SQL query compilers and database backends for siderite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
siderite-orm.workspace = true
async-trait.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
mongodb = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

# 0.32 shares libsqlite3-sys 0.30 with sqlx's `sqlite` feature, so there is
# one SQLite build (`links = "sqlite3"` allows no other).
[dependencies.rusqlite]
version = "0.32"
optional = true
features = ["bundled"]

[dependencies.mysql_async]
version = "=0.37.1"
optional = true
default-features = false
features = ["minimal-rust", "rustls-tls", "ring", "tls12"]

[features]
default = ["sqlite"]
tls = [
    "sqlx/tls-rustls-ring-webpki",
    "redis?/tokio-rustls-comp",
    "redis?/tls-rustls-webpki-roots",
]
sqlite = ["sqlx/sqlite"]
# Implies `sqlite`: it reuses that backend's write gate, schema-change and
# URL handling, and SQLite is linked once either way.
sqlite-native = ["sqlite", "dep:rusqlite"]
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
mysql-native = [
    "mysql", "dep:mysql_async", "dep:chrono", "dep:rust_decimal",
    "dep:serde_json",
]
mongodb = ["dep:mongodb", "dep:chrono", "dep:rust_decimal", "dep:serde_json", "dep:uuid"]
redis = ["dep:redis", "dep:serde", "dep:serde_json"]

[dev-dependencies]
base64.workspace = true
chrono.workspace = true
futures-util.workspace = true
rust_decimal.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
