[package]
name = "siderite-sessions"
description = "Cookie sessions, CSRF tokens and session stores for siderite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[features]
default = []
cache = ["dep:siderite-cache"]
redis = ["cache", "siderite-cache/redis"]

[dependencies]
siderite-core.workspace = true
siderite-openapi.workspace = true
siderite-cache = { workspace = true, optional = true }
async-trait.workspace = true
base64.workspace = true
getrandom.workspace = true
hmac.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tower.workspace = true
tracing.workspace = true

[dev-dependencies]
siderite-testkit.workspace = true
siderite-backends = { workspace = true, features = ["redis"] }
