[package]
name = "siderite-cli"
description = "The siderite command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
siderite-backends = { workspace = true, features = ["sqlite"] }
siderite-config.workspace = true
siderite-core.workspace = true
siderite-migrations.workspace = true
siderite-orm.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "process", "sync", "time"] }
url.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
jsonschema.workspace = true

[features]
default = []
postgres = ["siderite-backends/postgres"]
mysql = ["siderite-backends/mysql"]

[[bin]]
name = "siderite"
path = "src/main.rs"
doc = false
