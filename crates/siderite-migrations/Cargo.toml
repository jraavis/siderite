[package]
name = "siderite-migrations"
description = "Django-inspired schema migrations for siderite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
siderite-orm.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }

[features]
# Test-only: run the SQLite tests against `NativeSqliteBackend` instead of
# the SQLx backend (`cargo test -p siderite-migrations --features
# sqlite-native`). The library itself does not depend on a backend.
sqlite-native = ["siderite-backends/sqlite-native"]

[dev-dependencies]
async-trait.workspace = true
siderite-backends = { workspace = true, features = ["sqlite", "mysql", "postgres"] }
chrono.workspace = true
sqlx = { workspace = true, features = ["mysql", "postgres"] }
uuid.workspace = true
