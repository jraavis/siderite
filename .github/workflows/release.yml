name: Release

# A `v*` tag builds the prebuilt `siderite` CLI and publishes it as a
# GitHub release. A manual run builds the same archive as an artifact
# only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  FEATURES: mcp,postgres,mysql

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Read the version and check it against the tag
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "siderite-cli")
                     | .version')
          if [ "$GITHUB_REF_TYPE" = tag ] \
            && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - run: >-
          cargo build --release --locked -p siderite-cli
          --features "$FEATURES" --target "$TARGET"
      - name: Smoke test the binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bin="$PWD/target/$TARGET/release/siderite"
          test "$("$bin" --version)" = "siderite $VERSION"
          cd "$RUNNER_TEMP"
          "$bin" new smoke
          test -f smoke/Cargo.toml
      - name: Package the archive and its checksum
        id: package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          name="siderite-$VERSION-$TARGET"
          stage="$RUNNER_TEMP/$name"
          mkdir -p "$stage"
          cp "target/$TARGET/release/siderite" README.md \
            LICENSE-MIT LICENSE-APACHE "$stage/"
          tar -C "$RUNNER_TEMP" -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.name }}.tar.gz*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create the release with every archive
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
          --title "$TAG" --generate-notes --verify-tag
