name: Pages

on:
  push:
    branches: [master]
    paths:
      - website/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Push and pull_request jobs run only when the repository variable
  # AUTORUN is true. A workflow_dispatch always runs.
  autorun:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTORUN == 'true' }}
    runs-on: ubuntu-26.04
    steps:
      - run: "true"

  build:
    needs: autorun
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile
      - name: Build documentation site
        working-directory: website
        run: bun run build
      - name: Build rustdoc
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Copy rustdoc into the site
        run: |
          rm -rf website/dist/api
          cp -R target/doc website/dist/api
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    needs: [autorun, build]
    if: >-
      needs.autorun.result == 'success' && needs.build.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
