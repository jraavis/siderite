name: Pages

on:
  push:
    branches: [master]
    paths:
      - website/**
      - crates/**
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - website/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Push and pull_request jobs are skipped only while the repository
  # variable AUTORUN is false. A workflow_dispatch always runs.
  autorun:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.AUTORUN != 'false' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - run: "true"

  build:
    needs: autorun
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: pages
      - name: Install website dependencies
        working-directory: website
        run: bun install --frozen-lockfile
      - name: Build documentation site
        working-directory: website
        run: bun run build
      - name: Build rustdoc
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Copy rustdoc into the site
        run: |
          rm -rf website/dist/api
          cp -R target/doc website/dist/api
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    needs: [autorun, build]
    if: >-
      needs.autorun.result == 'success' && needs.build.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
